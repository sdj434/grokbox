plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lcs.grokbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.lcs.grokbox"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // 用 debug 签名，保证没有 keystore 也能直接出可安装包
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // 故意不引入 AndroidX / GMS：只用系统 WebView + HttpURLConnection
}
